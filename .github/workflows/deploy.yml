name: Deploy to AWS VM

on:
  push:
    branches:
      - deployment

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production-VM

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint

      - name: Generate or update Sitemap
        run: npm run sitemap

      - name: Build React App
        run: npm run build

      - name: Test write permission
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "User: $(whoami)"
            ls -la /var/www/html/Portfolio-Web
            touch /var/www/html/Portfolio-Web/test.txt && echo "Write OK" || echo "Write FAILED"
            rm -f /var/www/html/Portfolio-Web/test.txt

      - name: Deploy to AWS VM Via SSH
        uses: appleboy/scp-action@v0.1.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: 'dist/*'
          target: ${{ secrets.VM_TARGET }}
          strip_components: 1
          debug: true
